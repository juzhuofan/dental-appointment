# 统一入口：dev 使用 application-dev.yml，prod 使用 application-prod.yml
spring:
  profiles:
    active: dev

# 独立 XXL-JOB 调度中心；默认不开启执行器，不连接或初始化调度中心。
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
      timeout: ${XXL_JOB_ADMIN_TIMEOUT:3}
    executor:
      enabled: ${XXL_JOB_EXECUTOR_ENABLED:false}
      appname: ${XXL_JOB_EXECUTOR_APPNAME:dental-appointment-executor}
      access-token: ${XXL_JOB_EXECUTOR_ACCESS_TOKEN:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      log-path: ${XXL_JOB_EXECUTOR_LOG_PATH:.local/xxl-job/jobhandler}
      log-retention-days: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
