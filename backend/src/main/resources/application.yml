server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: dental-appointment
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:dental_appointment}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      transaction-isolation: TRANSACTION_READ_COMMITTED
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 700ms
      connect-timeout: 700ms
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis:
  configuration:
    map-underscore-to-camel-case: true
app:
  jwt-secret: ${JWT_SECRET}
  token-hours: 8
  demo-enabled: false
  cors-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    path: /v3/api-docs
