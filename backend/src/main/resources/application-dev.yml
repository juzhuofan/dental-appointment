# Public configuration; local credentials belong in the ignored application-private-dev.yml.
server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-private-dev.yml
  application:
    name: dental-appointment
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dental_appointment?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: 'root'
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      transaction-isolation: TRANSACTION_READ_COMMITTED
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 700ms
      connect-timeout: 700ms
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  ai:
    enabled: true
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    temperature: 0.1
    max-tokens: 1024
    connect-timeout: 3s
    read-timeout: 25s
    max-concurrent-calls: 3
    requests-per-minute: 10
  wechat:
    enabled: true
    app-id: wxebd957eb6746e73e
    app-secret: ${WECHAT_APP_SECRET:}
    # 当前为个人主体：使用微信身份与头像登录，手机号在就诊资料中填写。
  oss:
    # 先填写实际 Bucket 和凭证，再将 enabled 改为 true；以下均为静态配置。
    enabled: true
    endpoint: https://oss-cn-beijing.aliyuncs.com
    region: cn-beijing
    bucket-name: dental-backend
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    # 留空时使用 Bucket 的外网地址；也可填写已绑定的 HTTPS 自定义域名。
    public-base-url: ''
    object-prefix: dental/uploads
    max-file-size: 10MB
    allowed-extensions: [jpg, jpeg, png, gif, webp, pdf, doc, docx, xls, xlsx, txt, csv, zip]
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: 480
  demo-login:
    enabled: true
  cors-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

# 本地演示账号（明文）
DEMO_ADMIN_USERNAME: "admin"
DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:}
DEMO_DOCTOR_USERNAME: "doctor"
DEMO_DOCTOR_PASSWORD: ${DEMO_DOCTOR_PASSWORD:}
